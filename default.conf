# Docker's DNS. Upstreams use "resolve", so recreated containers (new IPs) are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream supabase_auth {
    zone supabase_auth 64k;
    server auth:9999 resolve;
}

upstream supabase_storage {
    zone supabase_storage 64k;
    server storage:5000 resolve;
}

# Keep the scheme Caddy/Traefik report; fall back to the local one.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Public API: https://<supabase domain>/auth/v1/* and /storage/v1/*
server {
    listen 8000;
    server_tokens off;
    access_log off;                 # signed Storage URLs carry their token in the query string
    client_max_body_size 60m;       # a bit above FILE_SIZE_LIMIT (50 MB)

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $fwd_proto;
    proxy_set_header X-Forwarded-Host   $host;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static proxy_pass with a trailing "/" strips the prefix; the query string is passed unchanged.
    location /auth/v1/ {
        proxy_pass http://supabase_auth/;
    }

    location /storage/v1/ {
        proxy_set_header X-Forwarded-Prefix /storage/v1;
        proxy_request_buffering off;   # stream uploads
        proxy_buffering off;           # stream downloads
        proxy_read_timeout 300s;
        proxy_pass http://supabase_storage/;
    }

    location / {
        return 404;
    }
}

# Internal only (no domain in Coolify): e-mail templates fetched by Supabase Auth.
server {
    listen 8081;
    server_tokens off;
    access_log off;
    location /email-templates/ {
        root /usr/share/nginx;
        default_type text/html;
    }
    location / {
        return 404;
    }
}
